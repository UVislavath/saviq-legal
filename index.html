<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SaviQ</title>
<link rel="icon" href="icon.png">
<style>
:root { --bg:#0b1a33; --surface:#12264a; --text:#eef3fb; --muted:#a9b8d0;
        --accent:#5fd3bc; --border:#23406e; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text);
       font:17px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; }
main { max-width:720px; margin:0 auto; padding:32px 20px 64px; }
header { display:flex; align-items:center; gap:12px; margin-bottom:24px; }
header img { width:44px; height:44px; border-radius:10px; }
header a { color:var(--text); text-decoration:none; font-weight:700; font-size:20px; }
h1 { font-size:32px; line-height:1.2; margin:8px 0 12px; }
h2 { font-size:20px; margin:32px 0 8px; }
p, li { color:var(--muted); }
a { color:var(--accent); }
ul { padding-left:22px; }
.card { background:var(--surface); border:1px solid var(--border); border-radius:14px;
        padding:16px 20px; margin:16px 0; }
.card a { font-weight:600; }
.card p { margin:0; }
footer { margin-top:48px; font-size:14px; color:var(--muted); }
</style>
</head>
<body>
<main>
<header><img src="icon.png" alt=""><a href="">SaviQ</a></header>
<h1>SaviQ</h1>
<p>A private, local-first place to save documents, scans and notes, and find them fast.</p>
<div class="card"><a href="privacy/">Privacy Policy</a></div>
<div class="card"><a href="support/">Support</a></div>
<div class="card"><p>Email <a href="mailto:saviq.support@gmail.com">saviq.support@gmail.com</a>. Never attach private documents, passwords or screenshots of private content.</p></div>
<footer>SaviQ &middot; Save Everything. Find Anything.</footer>
</main>
</body>
</html>
